bookdown::bs4_book:
  theme:
    primary: "#0d6efd"
    base_font:
      google: "Source Sans Pro"
    code_font:
      google: "JetBrains Mono"
  css: style.css
  repo:
    base: https://github.com/jaeyk/PS239T
    branch: main

bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: natbib
  number_sections: true
  fig_caption: true
  toc: true
  toc_depth: 2
  includes:
    in_header: preamble.tex

bookdown::epub_book:
  stylesheet: style.css
  cover_image: images/cover.png
  metadata:
    title: "PS 239T – Computational Thinking for Social Scientists"
    creator: "Jae Yeon Kim"
    rights: |
      © 2025 Jae Yeon Kim. Licensed under a
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
      CC BY‑NC‑SA 4.0</a> International License.
